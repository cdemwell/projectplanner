name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Installs runtime + dev groups exactly as locked; --frozen fails CI if
        # uv.lock is out of date with pyproject.toml.
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check backend cli tui main.py tests

      - name: Test (pytest)
        run: uv run python -m pytest -q