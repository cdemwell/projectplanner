[project]
name = "projectplanner"
version = "0.1.0"
description = "Local project-planning tool (Shortcut-model-inspired) over SQLite."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Backend + CLI are stdlib-only; Textual is used only by the TUI.
    "textual>=0.80",
]

[project.optional-dependencies]
# Backend + CLI tests need pytest; TUI tests also need textual (already above).
# ruff is the linter/formatter used in CI and locally.
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "hypothesis",
    "pyyaml>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line length: schema DDL and compact arg-registration lines run long
    "E701",  # allow compact `def f(): return x` one-liners (CLI handlers)
    "E702",  # allow `a(); b()` compact argparse flag registration
]

[tool.ruff.lint.per-file-ignores]
# Test files may use star/unused imports and assert-heavy patterns; TUI tests
# import textual after pytest.importorskip, which is a deliberate E402.
"tests/*" = ["F401", "E402"]